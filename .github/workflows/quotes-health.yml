name: quotes-health

# Monitors the published data branch. Fails loudly when quotes stop updating so
# the workflow badge turns red and repo watchers get a notification.

on:
  schedule:
    - cron: '5 * * * *'   # hourly, offset from the quotes cron
  workflow_run:
    workflows: [quotes]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: quotes-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check data branch freshness and coverage
        env:
          MAX_AGE_MINUTES: 30
          AUTO_BOOTSTRAP_QUOTES: ${{ github.event_name == 'schedule' && 'true' || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/check-quotes-health.sh

  report-failure:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open tracking issue for quotes failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="quotes workflow failed (run ${{ github.event.workflow_run.id }})"
          if gh issue list --search "$TITLE in:title" --state open --json title --jq '.[].title' | grep -qF "$TITLE"; then
            echo "Open issue already exists."
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --body "The [quotes workflow](${{ github.event.workflow_run.html_url }}) failed. ESP8266 devices using the GitHub quote source may serve stale data until this is fixed."
